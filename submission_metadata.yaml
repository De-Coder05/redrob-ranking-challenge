methodology_summary: |
  Rule-based ranker with explicit JD-derived scoring and honeypot defense.
  Five weighted components: Technical Depth (28%, career-description keyword
  evidence with word-boundary matching, skills cross-validated against career
  text to catch keyword stuffers, platform assessments), Title Relevance
  (25%, four-tier taxonomy from ML/NLP/Search/Reco engineer down to
  non-technical), Career Quality (20%, product-company tenure,
  consulting-only careers penalised), Experience Fit (17%, YOE curve peaking
  6-8 yrs, ML title recency, production evidence), Behavioural Availability
  (10%, open-to-work, activity recency, response rate, notice period,
  GitHub). Location is a soft multiplier (Pune/Noida highest); JD-stated
  disqualifiers stack as hard multiplicative penalties. Honeypot defense
  verifies every profile against itself: role durations contradicting their
  own start/end dates, expert skills with zero months of use, YOE exceeding
  career span, and skill durations predating the technology's public release
  (month-precision dates for 15 modern AI technologies). 141 internally
  inconsistent profiles detected; zero in the submitted top 100. Reasoning
  strings are generated per-candidate from profile facts only, with honest
  concerns and varied phrasing. Deterministic, stdlib-only, ~31 seconds for
  100K candidates on one CPU core.

